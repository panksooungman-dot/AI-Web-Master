name: Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found. Skipping dependency installation."
          fi

      - name: Run npm Audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high || true
          else
            echo "No package.json found. Skipping npm audit."
          fi

      - name: Check for Secrets
        run: |
          echo "Scanning repository for common secret patterns..."

          # Each prefix requires the token body that a real credential of that kind actually
          # carries. Matching the bare prefix flagged documentation that merely *names* a token
          # format — "Classic PAT(`ghp_...`, `repo` scope)" in PHASE3_REPORT.md failed every run
          # on main, which trains everyone to ignore a red security check. Requiring the body
          # loses no detection: a real credential always has one, a placeholder never does.
          #   AKIA  + 16 uppercase/digits          AWS access key id
          #   AIza  + 35 key chars                 Google API key
          #   ghp_  + 36 alnum                     GitHub classic PAT
          #   xoxb- + Slack's digit/alnum sections Slack bot token
          if grep -R -E "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z]{36}|xoxb-[0-9]{10,}-[0-9A-Za-z]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude=security.yml; then
            echo "Potential secrets detected."
            exit 1
          else
            echo "No obvious secrets detected."
          fi

      - name: Dependency Summary
        run: |
          echo "=================================="
          echo "AI Business OS Security Scan"
          echo "=================================="
          echo "✓ Dependency Audit"
          echo "✓ Secret Scan"
          echo "=================================="

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: tests/reports/
          if-no-files-found: ignore